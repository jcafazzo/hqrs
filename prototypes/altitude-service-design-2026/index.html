<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Altitude Blue reconstruction of HQRS 846 Service Design.">
  <link rel="stylesheet" href="../lecture-refresh-shared/deck.css">
  <script src="content.js"></script>
  <script>
    if (location.protocol === 'file:' || new URLSearchParams(location.search).has('private')) {
      document.write('<script src="original-map.js"><\/script>');
    }
  </script>
  <script src="../lecture-refresh-shared/deck.js" defer></script>
  <title>HQRS 846 · Service Design · 2026</title>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="pill" href="../lecture-refresh-2026/">← Lecture review</a>
      <div class="deck-identity"><strong>HQRS 846</strong><span data-section>Service Design</span></div>
      <div class="header-actions">
        <a class="pill review-link" href="../lecture-refresh-2026/service-design-review.html">Adversarial review</a>
        <button class="pill" type="button" data-action="notes">Notes</button>
        <button class="pill" type="button" data-action="outline">Outline</button>
        <button class="pill" type="button" data-action="help">Controls</button>
      </div>
    </header>
    <main class="deck" aria-live="polite"><section class="slide" aria-label="Current slide"></section></main>
    <footer class="app-footer">
      <button class="footer-button" type="button" data-action="back" aria-label="Previous slide">←</button>
      <div class="progress-track"><div class="progress-bar"></div></div>
      <button class="mode-button is-active" type="button" data-mode="teaching">2026 teaching path</button>
      <button class="mode-button" type="button" data-mode="originals">All 182 originals</button>
      <button class="mode-button" type="button" data-action="source">Original page</button>
      <span class="position" data-position></span>
      <button class="footer-button" type="button" data-action="next" aria-label="Next slide">→</button>
    </footer>
  </div>
  <aside class="drawer outline-drawer" role="dialog" aria-modal="true" aria-labelledby="outline-title" aria-hidden="true" inert>
    <header><div><p>Lecture structure</p><h2 id="outline-title">Slide outline</h2></div><button type="button" data-action="close" aria-label="Close outline">×</button></header>
    <label class="search"><span>Find a slide</span><input type="search" placeholder="Title, section, or source page" data-outline-search></label>
    <div class="outline-list" data-outline-list></div>
  </aside>
  <aside class="drawer notes-drawer" role="dialog" aria-modal="true" aria-labelledby="notes-title" aria-hidden="true" inert>
    <header><div><p>Presenter view</p><h2 id="notes-title">Teaching note</h2></div><button type="button" data-action="close" aria-label="Close notes">×</button></header>
    <div class="notes-body" data-notes></div>
  </aside>
  <aside class="help-dialog" role="dialog" aria-modal="true" aria-labelledby="help-title" aria-hidden="true" inert>
    <header><h2 id="help-title">Controls</h2><button type="button" data-action="close" aria-label="Close controls">×</button></header>
    <div class="shortcut"><kbd>→ / Space</kbd><span>Next</span></div>
    <div class="shortcut"><kbd>←</kbd><span>Previous</span></div>
    <div class="shortcut"><kbd>M</kbd><span>Teaching path / original inventory</span></div>
    <div class="shortcut"><kbd>O</kbd><span>Altitude treatment / original page</span></div>
    <div class="shortcut"><kbd>N</kbd><span>Presenter note</span></div>
    <div class="shortcut"><kbd>H</kbd><span>Controls</span></div>
    <div class="shortcut"><kbd>Esc</kbd><span>Close panel</span></div>
  </aside>
</body>
</html>
